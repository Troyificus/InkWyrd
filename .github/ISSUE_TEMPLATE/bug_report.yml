name: Bug Report
description: Something on the site isn't working right
labels: ["bug"]
body:
  - type: dropdown
    id: page
    attributes:
      label: Which tool were you using?
      options:
        - Daggerheart Statblock Generator
        - Daggerheart Magic Item Generator
        - D&D 5E Statblock Generator
        - D&D 5E Magic Item Generator
        - Pathfinder 2E Statblock Generator
        - Pathfinder 2E Magic Item Generator
        - NPC Generator
        - Hub / homepage
        - Something else
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, as specifically as you can describe it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen instead?
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can reliably make it happen again, what did you click/type, in order?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop image files here if you have any, it's often the fastest way to show what's wrong.
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser / device (if you know it)
      placeholder: e.g. Chrome on Windows, Safari on iPhone
    validations:
      required: false
